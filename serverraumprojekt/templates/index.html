<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Serverraum Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="dashboard">

    <div class="header">
        <div>
            <h1>Serverraum Dashboard</h1>
            <p>Überwachungs- und Verwaltungssystem</p>
        </div>
        <div class="header-status">
            <span>System aktiv</span>
        </div>
    </div>

    <div class="grid-container">

        <!-- Umweltwerte -->
        <div class="card">
            <h2>Umweltwerte</h2>
            <div class="sensor-grid">

                <div class="sensor-box">
                    <h3>Temperatur</h3>
                    <p class="value" id="temperatur">-- °C</p>
                    <span class="badge" id="badge-temp">OK</span>
                </div>

                <div class="sensor-box">
                    <h3>Luftfeuchtigkeit</h3>
                    <p class="value" id="luftfeuchtigkeit">-- %</p>
                    <span class="badge">OK</span>
                </div>

            </div>
        </div>

        <!-- Lüftersteuerung -->
        <div class="card">
            <h2>Lüftersteuerung</h2>
            <p><strong>Status:</strong> <span id="motor-status">--</span></p>
            <p><strong>Modus:</strong> Automatik</p>
            <p><strong>Grund:</strong> <span id="motor-grund">--</span></p>
            <p><strong>Grenzwert:</strong> <span id="grenzwert">--</span> °C</p>
        </div>

        <!-- Türstatus -->
        <div class="card wide">
            <h2>Zutritt · Türstatus</h2>

            <p>
                <strong>Türstatus:</strong>
                <span id="tuer-status" style="font-weight:bold;">--</span>
            </p>

            <p>
                <strong>Letzter RFID-Zugriff:</strong>
                <span id="letzter-zugriff">--</span>
            </p>

        </div>

    </div>
</div>

<script>
async function ladeDaten() {
    try {
        const antwort = await fetch("/api/sensordaten/?t=" + Date.now());
        const daten = await antwort.json();

        // Umwelt
        document.getElementById("temperatur").innerText =
            daten.temperatur !== null ? daten.temperatur + " °C" : "-- °C";
        document.getElementById("luftfeuchtigkeit").innerText =
            daten.luftfeuchtigkeit !== null ? daten.luftfeuchtigkeit + " %" : "-- %";

        // Lüfter
        document.getElementById("motor-status").innerText  = daten.motor      ?? "--";
        document.getElementById("motor-grund").innerText   = daten.motor_grund ?? "--";
        document.getElementById("grenzwert").innerText     = daten.grenzwert   ?? "--";

        // Tür 
        const tuerOffen = daten.tuer_offen;
        const tuerEl    = document.getElementById("tuer-status");

        if (tuerOffen === true) {
            tuerEl.innerText  = "Geöffnet";
            tuerEl.style.color ="#27ae60";
        } else if (tuerOffen === false) {
            tuerEl.innerText  = "Geschlossen";
            tuerEl.style.color ="#e74c3c";
        } else {
            tuerEl.innerText  = "--";
            tuerEl.style.color = "";
        }

        document.getElementById("letzter-zugriff").innerText =
            daten.letzter_zugriff ?? "--";

    } catch (fehler) {
        console.log("Fehler beim Laden:", fehler);
    }
}

ladeDaten();
setInterval(ladeDaten, 1000);
</script>

</body>
</html>
